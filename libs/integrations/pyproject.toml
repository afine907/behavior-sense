[project]
name = "behavior-integrations"
version = "1.0.0"
description = "BehaviorSense integrations for LangChain and other frameworks"
requires-python = ">=3.11"

dependencies = [
    "behavior-core",
    "langchain-core>=0.1.0",
    "pydantic>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/behavior_integrations"]
