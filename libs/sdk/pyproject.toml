[project]
name = "behavior-sdk"
version = "2.0.0"
description = "BehaviorSense Agent Analytics SDK client library"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.5.0",
    "httpx>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/behavior_sdk"]
